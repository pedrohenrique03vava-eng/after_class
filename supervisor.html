<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After Class - Painel do Supervisor</title>
    <link rel="stylesheet" href="supervisor.css">
</head>
<body>
    <img src="img/images-removebg-preview.png" alt="Logo">

    <main class="container-supervisor">
        <header>
            <h2>Painel de Supervisão</h2>
            <p>Selecione um laboratório para gerenciar os agendamentos e alunos.</p>
        </header>

        
        <div class="grid-labs">
            <div class="card-lab" onclick="verAlunos('Informatica_1')">
                <h3>Informática 01</h3>
                <span></span>
            </div>
            <div class="card-lab" onclick="verAlunos('Informatica_2')">
                <h3>Informática 02</h3>
                <span></span>
            </div>
            <div class="card-lab" onclick="verAlunos('Informatica_3')">
                <h3>Informatica 03</h3>
                <span></span>
            </div>
            <div class="card-lab" onclick="verAlunos('Informatica_4')">
                <h3>Informática 04</h3>
                <span></span>
            </div>
            <div class="card-lab" onclick="verAlunos('Informatica_5')">
                <h3>Informática 05</h3>
                <span></span>
            </div>
        </div>

        
        <section id="detalhesLab" class="secao-detalhes">
            <h3 id="tituloLab">Alunos em: Informatica 01</h3>
            <table class="tabela-alunos">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Horário</th>
                        <th>Atividade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaAlunos">
                    
                    <tr>
                        <td>EX:Carlos Silva</td>
                        <td>EX:14:00 - 16:00</td>
                        <td>EX:Projeto Python</td>
                        <td><button class="btn-check">Confirmar</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <a href="index.html" style="text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px;">Sair do Sistema</a>

    <script src="supervisor.js"></script>
</body>
</html>
