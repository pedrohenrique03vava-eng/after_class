<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento Simples</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        form { width: 300px; display: flex; flex-direction: column; gap: 15px; box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px; padding: 20px; border-radius: 5px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
        button:hover { background: darkblue; }
    </style>
</head>
<body>

    <form id="meuForm">
        <h2>Aula Extra Curricular</h2>
        
        <label>Nome Completo</label>
        <input type="text" id="nomeCompleto" placeholder="Seu nome" required>

        <label>E-mail</label>
        <input type="email" id="emailCorporativo" placeholder="seu@email.com" required>

        <label>Data</label>
        <input type="date" id="date-picker" required>

        <button type="submit" id="butEnviar">Garantir minha vaga</button>
    </form>

    <script src="index.js"></script>
</body>
</html>
